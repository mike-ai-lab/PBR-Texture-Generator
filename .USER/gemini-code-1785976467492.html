<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PBR Height Map Generator & Previewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #e0e0e0;
    }
    #viewport {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 320px;
      background: rgba(25, 25, 25, 0.85);
      backdrop-filter: blur(8px);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .control-group {
      margin-bottom: 15px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: #aaa;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #007acc;
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #007acc;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #005999;
    }
    canvas#heightCanvas {
      display: none;
    }
  </style>
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="controls">
    <div class="control-group">
      <label for="textureInput" class="btn">Upload Texture</label>
      <input type="file" id="textureInput" accept="image/*">
    </div>

    <div class="control-group">
      <label>Displacement Scale <span id="val-disp">0.15</span></label>
      <input type="range" id="dispScale" min="0" max="0.5" step="0.01" value="0.15">
    </div>

    <div class="control-group">
      <label>Height Map Contrast <span id="val-contrast">1.2</span></label>
      <input type="range" id="contrast" min="0.5" max="3.0" step="0.1" value="1.2">
    </div>

    <div class="control-group">
      <label>Height Map Invert</label>
      <input type="checkbox" id="invert">
    </div>

    <div class="control-group">
      <label>Roughness <span id="val-roughness">0.6</span></label>
      <input type="range" id="roughness" min="0" max="1" step="0.05" value="0.6">
    </div>
  </div>

  <canvas id="viewport"></canvas>
  <canvas id="heightCanvas"></canvas>

  <script>
    // --- Setup Scene, Camera, Renderer ---
    const viewport = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 3);

    const renderer = new THREE.WebGLRenderer({ canvas: viewport, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(3, 4, 2);
    scene.add(dirLight);

    // --- Material & Mesh ---
    // High segment density is required for real-time vertex displacement mapping
    const geometry = new THREE.PlaneGeometry(2, 2, 256, 256);
    const material = new THREE.MeshStandardMaterial({
      side: THREE.DoubleSide,
      roughness: 0.6,
      metalness: 0.1
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.rotation.x = -Math.PI / 3;
    scene.add(mesh);

    // --- Default Procedural Texture Canvas ---
    const heightCanvas = document.getElementById('heightCanvas');
    const ctx = heightCanvas.getContext('2d');
    let loadedImage = null;

    function createDefaultStoneTexture() {
      heightCanvas.width = 512;
      heightCanvas.height = 512;
      ctx.fillStyle = "#808080";
      ctx.fillRect(0, 0, 512, 512);

      // Simple noisy pattern simulation as default
      const imgData = ctx.getImageData(0, 0, 512, 512);
      for (let i = 0; i < imgData.data.length; i += 4) {
        let val = Math.floor(Math.random() * 255);
        imgData.data[i] = val;
        imgData.data[i + 1] = val;
        imgData.data[i + 2] = val;
        imgData.data[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      
      const texture = new THREE.CanvasTexture(heightCanvas);
      material.map = texture;
      material.displacementMap = texture;
      material.displacementScale = 0.15;
      material.needsUpdate = true;
    }
    createDefaultStoneTexture();

    // --- Dynamic Height Map Processing ---
    function processHeightMap() {
      if (!loadedImage) return;

      const w = loadedImage.width;
      const h = loadedImage.height;
      heightCanvas.width = w;
      heightCanvas.height = h;

      ctx.drawImage(loadedImage, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      const contrast = parseFloat(document.getElementById('contrast').value);
      const invert = document.getElementById('invert').checked;

      // Luminance conversion & contrast adjustment
      for (let i = 0; i < data.length; i += 4) {
        // Luminance factor
        let gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        
        // Contrast adjustment
        gray = ((gray / 255 - 0.5) * contrast + 0.5) * 255;
        gray = Math.min(255, Math.max(0, gray));

        if (invert) gray = 255 - gray;

        data[i] = gray;
        data[i + 1] = gray;
        data[i + 2] = gray;
      }

      ctx.putImageData(imgData, 0, 0);

      const heightTexture = new THREE.CanvasTexture(heightCanvas);
      heightTexture.wrapS = THREE.RepeatWrapping;
      heightTexture.wrapT = THREE.RepeatWrapping;

      material.displacementMap = heightTexture;
      material.needsUpdate = true;
    }

    // --- Event Listeners & UI Controls ---
    document.getElementById('textureInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;

          // Set Diffuse Texture
          const diffuseTexture = new THREE.Texture(img);
          diffuseTexture.needsUpdate = true;
          material.map = diffuseTexture;

          processHeightMap();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('dispScale').addEventListener('input', (e) => {
      material.displacementScale = parseFloat(e.target.value);
      document.getElementById('val-disp').innerText = e.target.value;
    });

    document.getElementById('contrast').addEventListener('input', (e) => {
      document.getElementById('val-contrast').innerText = e.target.value;
      processHeightMap();
    });

    document.getElementById('invert').addEventListener('change', () => {
      processHeightMap();
    });

    document.getElementById('roughness').addEventListener('input', (e) => {
      material.roughness = parseFloat(e.target.value);
      document.getElementById('val-roughness').innerText = e.target.value;
    });

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Render Loop ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
